[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ovc"
version = "0.1.0"
description = "La vente d'options d'achat couvertes, démontée : reconstruction du BXM par Black-Scholes et VIX (l'écart chiffre le skew), prime de risque de variance à la Carr-Wu, et le duel canadien ZWB contre ZEB."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "typer>=0.12",
  "requests>=2.32",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ovc = "ovc.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/16-options-couvertes"

[tool.hatch.build.targets.wheel]
packages = ["src/ovc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
